name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/backend

      - name: Credit ledger tests
        run: npm run test:ledger
        working-directory: src/backend

      - name: Peer push tests
        run: npm run test:push
        working-directory: src/backend

      - name: Migration runner tests
        run: npm run test:migrations
        working-directory: src/backend

      - name: AI companion tests
        run: npm run test:ai
        working-directory: src/backend

  test-deploy-scripts:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy script tests
        run: node --test scripts/deploy/tests/*.test.mjs

  migration-replay:
    name: Migration replay (fresh DB)
    # Applies every migration from 001 on an empty Postgres, the way a new
    # environment (staging, local) gets built. Catches migrations that only
    # work on prod's existing data, like 092 once did.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Supabase shim (roles, auth.uid)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/backend/tests/fixtures/supabase-shim.sql

      - name: Replay all migrations
        run: |
          npm ci
          npm run migrate
          node migrations/run.js --check
        working-directory: src/backend

  lint-frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint
        run: npm run lint
        working-directory: src/frontend

  build-docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      packages: write   # needed to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f src/backend/Dockerfile -t peerpal-backend src/backend/

      # ── Integration smoke test ────────────────────────────────────────────────
      # Starts the container with a fake DATABASE_URL so the process boots.
      # /health returns 200 even with a bad DB (it reports db:"error" but stays up).
      # This proves: image starts, Node finds server.js, port binding works.
      - name: Smoke test — container starts and /health responds
        run: |
          docker run -d --name smoke \
            -p 3001:3001 \
            -e NODE_ENV=test \
            -e PORT=3001 \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=smoketest \
            -e FRONTEND_URL=http://localhost \
            peerpal-backend
          # Wait up to 30s for the server to bind
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/health || echo 000)
            echo "attempt $i: HTTP $STATUS"
            # 200 = healthy DB, 503 = degraded DB but server is up — both prove the image boots
            [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ] && break
            [ "$i" = "10" ] && echo "smoke test failed — server never responded" && docker logs smoke && exit 1
            sleep 3
          done
          docker stop smoke

      # ── GHCR push — only on main branch, not on PRs ──────────────────────────
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/peerpal-backend
          docker tag peerpal-backend "$IMAGE:${{ github.sha }}"
          docker tag peerpal-backend "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "### Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA tag: \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- latest tag: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
