name: Keep Supabase alive

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL not configured — skipping keep-alive ping"
            exit 0
          fi
          # Retry up to 6 times (90s) — Render free tier takes ~22s to wake from sleep
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health")
            echo "Attempt $i: /health → $STATUS"
            [ "$STATUS" = "200" ] && echo "Backend is alive." && exit 0
            sleep 15
          done
          echo "Backend did not respond in time"
          exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
