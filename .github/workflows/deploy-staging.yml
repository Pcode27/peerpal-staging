name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  mirror:
    name: Mirror to staging repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to staging mirror
        run: |
          git remote add staging https://github.com/${MIRROR_REPO}.git
          git -c credential.helper= -c "http.https://github.com/.extraheader=Authorization: Basic $(echo -n "x-access-token:${MIRROR_TOKEN}" | base64 -w0)" push staging HEAD:main --force
          echo "Mirrored to ${MIRROR_REPO}"
        env:
          MIRROR_TOKEN: ${{ secrets.STAGING_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.STAGING_MIRROR_REPO }}

  health-check:
    name: Staging backend health check
    runs-on: ubuntu-latest
    needs: mirror
    steps:
      - name: Wait for staging backend
        run: |
          STAGING_URL="${{ vars.STAGING_BACKEND_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_BACKEND_URL not set — skipping health check"
            exit 0
          fi
          echo "Waiting for ${STAGING_URL}/health ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health")
            echo "Attempt $i: /health → $STATUS"
            [ "$STATUS" = "200" ] && echo "Staging is up." && exit 0
            sleep 15
          done
          echo "Staging health check timed out after 6 minutes"
          exit 1
